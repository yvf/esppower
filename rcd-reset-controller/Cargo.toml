[package]
name = "rcd-reset-controller"
version = "0.1.0"
edition = "2021"
authors = ["Yan Fitterer"]
description = "RCD Reset Controller — ESP32-H2, Matter over Thread, Apple HomeKit"

[[bin]]
name = "rcd-reset-controller"
harness = false  # embassy_executor::main provides its own entry point

[lib]
name = "rcd_reset_controller"
path = "src/lib.rs"

[[example]]
name = "hw_actuator"
path = "tests/integration/hw_actuator.rs"

[[example]]
name = "hw_sensor"
path = "tests/integration/hw_sensor.rs"
required-features = ["sensor-ct"]

[[example]]
name = "hw_emf"
path = "tests/integration/hw_emf.rs"
required-features = ["sensor-emf"]

[[example]]
name = "hw_full_cycle"
path = "tests/integration/hw_full_cycle.rs"
required-features = ["sensor-ct"]

[features]
# Exactly one power-sensing backend must be active per build.
# EMF (contactless electromagnetic-field detector on GPIO4) is the default.
# CT (SCT-013 current transformer on the ADC) is kept available behind a flag.
default     = ["sensor-emf"]
sensor-emf  = []
sensor-ct   = []

[dependencies]
# ESP-IDF HAL and services — verify latest compatible versions at https://github.com/esp-rs
esp-idf-svc = { version = "0.52", features = [
    "std",
    "alloc",
    "experimental",
    "embassy-time-driver",
    "critical-section",
] }
esp-idf-hal = { version = "0.46" }
esp-idf-sys = { version = "0.37", features = ["binstart"] }

# Matter over Thread + BLE commissioning on ESP-IDF.
# esp-idf-matter wraps rs-matter with the Espressif Thread/BLE transports,
# NVS persistence, and the EspThreadMatterStack assembly. It tracks the
# `sysgrok` forks of rs-matter / rs-matter-stack — see [patch.crates-io] below,
# which MUST live in this (root) crate for the redirect to take effect.
# Vendored under vendor/esp-idf-matter with a local patch relaxing the module
# gate so the high-level Thread stack is available on the pure-Thread ESP32-H2
# (upstream a8a1b98 hard-excluded esp32h2). See SETUP.md.
esp-idf-matter = { path = "vendor/esp-idf-matter", default-features = false, features = [
    "std",
    "async-io-mini",
    "log",
    "rustcrypto",
    # Shrink rs-matter's static allocations so more SRAM is left as heap for
    # Bluedroid to initialize (H2 has only ~320 KB SRAM; Bluedroid mallocs a
    # large env at init, and "Bluedroid Initialize Fail" is the failure we hit).
    # These are still ample for a single-purpose HomeKit device. Tune up if
    # commissioning runs short of buffers/sessions.
    "max-fabrics-2",
    "max-subscriptions-1",
    "max-im-buffers-4",
    "max-sessions-4",
] }

# Async building blocks (embassy time/sync drive the controller loop; Matter and
# the controller each run under `esp_idf_svc::hal::task::block_on` in their own
# thread, so no standalone executor crate is needed).
embassy-time     = { version = "0.5" }
embassy-sync     = { version = "0.8" }
embassy-futures  = { version = "0.1" }
# Provides embassy-time's timer queue (the `__embassy_time_queue_item_from_waker`
# symbol). Required because we drive futures with esp-idf `block_on` rather than
# embassy-executor (which would otherwise supply an integrated timer queue).
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }

# Static allocation for the (large) Matter stack + CSPRNG for crypto/dataver.
static_cell = "2.1"
rand        = "0.8"

# Utilities
log       = "0.4"
anyhow    = { version = "1", features = ["std"] }
heapless  = "0.8"

[dev-dependencies]
# Host-side test helpers (unit tests only, not flashed)
mockall = "0.13"

[build-dependencies]
embuild = "0.33"

# esp-idf-matter is built against coordinated forks of rs-matter and
# rs-matter-stack (the `next` branches). Cargo only honours [patch] from the
# root crate, so these must be declared here rather than in esp-idf-matter.
[patch.crates-io]
rs-matter       = { git = "https://github.com/sysgrok/rs-matter",       branch = "next" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next" }

[profile.release]
opt-level     = "s"   # optimise for size
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1          # light optimisation to keep RAM usage manageable
panic     = "abort"
