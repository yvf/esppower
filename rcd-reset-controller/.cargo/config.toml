[build]
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
# Runner flashes + opens the serial monitor. We go through flash.sh (not a bare
# `espflash flash --monitor`) so the project's OWN esp-idf-sys bootloader and
# partition table are flashed, instead of espflash's bundled images whose ESP-IDF
# version differs and crash-loops the chip before cpu_start.
runner  = "./flash.sh"
rustflags = [
    # Required by esp-idf-sys
    "--cfg", "espidf_time64",
]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# ESP-IDF version — must match what is installed / fetched by embuild.
# v5.5.x is required by esp-idf-matter's Thread support (the esp-rs Thread driver
# gates functionality on patch levels ≥5.2.6/≥5.5.0; the esp-idf-matter reference
# is built against v5.5.3, so we match it to stay on the known-good path).
ESP_IDF_VERSION       = "v5.5.3"
# Target chip — esp-idf-sys reads `MCU`, NOT `IDF_TARGET`, to choose the chip.
# The riscv32imac-esp-espidf triple maps to [esp32c6, esp32c61, esp32c5, esp32h2];
# without MCU set, esp-idf-sys silently defaults to the FIRST entry (esp32c6),
# producing a C6 binary that instantly crash-loops on H2 hardware. Must be explicit.
MCU                   = "esp32h2"
# Kept only for documentation; esp-idf-sys ignores IDF_TARGET as an input and sets
# it itself from MCU.
IDF_TARGET            = "esp32h2"
# Silence noise from the C++ SDK build
CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG = "false"
