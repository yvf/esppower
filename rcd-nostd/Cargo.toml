[package]
name = "rcd-nostd"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["Yan Fitterer"]
description = "RCD Reset Controller — ESP32-H2, no-std (esp-hal) Matter over Thread"

[[bin]]
name = "rcd-nostd"
path = "src/main.rs"
harness = false

# ─── Core no-std esp-hal stack (version matrix from esp-rs/openthread esp example) ──
[dependencies]
esp-hal       = { version = "1.1", features = ["esp32h2", "log-04", "unstable", "exception-handler"] }
esp-rtos      = { version = "0.3", features = ["esp32h2", "esp-radio", "embassy"] }
esp-radio     = { version = "0.18", features = ["esp32h2", "unstable", "ieee802154", "ble"] }
esp-alloc     = { version = "0.10" }
esp-backtrace = { version = "0.19", features = ["esp32h2", "panic-handler", "println"] }
esp-println   = { version = "0.17", features = ["esp32h2", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32h2", "log-04"] }

embassy-executor = { version = "0.10" }
embassy-time     = { version = "0.5" }
# 0.7 to match trouble-host 0.6's `#[gatt_server]` macro (it resolves the bare
# `embassy_sync` path against THIS crate's dep). openthread/rs-matter pull their
# own 0.8 transitively; we never cross the two versions' types directly.
embassy-sync     = { version = "0.7" }
embassy-futures  = { version = "0.1" }

log            = "0.4"
critical-section = "1.2"
static_cell    = "2.1"
heapless       = "0.8"
rand_core      = "0.9"
# Force subtle ≥2.6 so it unifies across rs-matter (needs 2.6) and esp-radio's
# 802.15.4 ccm (vendored, pin relaxed). Direct dep makes it survive `cargo update`.
subtle         = { version = "2.6", default-features = false }

# Thread via OpenThread (prebuilt lib for riscv32imac-unknown-none-elf — no C build).
# H2 802.15.4 radio supported out of the box via the esp-radio feature.
openthread = { git = "https://github.com/esp-rs/openthread", features = [
    "esp-radio", "udp", "srp", "dns-client", "edge-nal", "isupper", "log",
] }
# C-lib shims OpenThread needs (utoa/strtoul) in no_std.
tinyrlibc  = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }

# BLE host (commissioning). Pinned to 0.6: it uses bt-hci 0.8.1, which esp-radio
# 0.18's BleConnector implements (trouble main needs bt-hci 0.9 → mismatch).
# 0.6 brings embassy-sync 0.7 — see the embassy-sync note above.
trouble-host = { version = "0.6", features = ["default-packet-pool-mtu-255", "derive"] }

# Matter: the generic rs-matter-stack (no_std, alloc + rustcrypto) on rs-matter.
# The transport glue (GattPeripheral over trouble, Thread over openthread) is ours.
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next", default-features = false, features = ["rustcrypto", "alloc"] }

# rs-matter-stack consumes rs-matter from crates.io; redirect both to the
# coordinated `sysgrok` forks (next). Patches only take effect from the root crate.
[patch.crates-io]
rs-matter       = { git = "https://github.com/sysgrok/rs-matter",       branch = "next" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next" }
# ccm 0.4.4 (esp-radio's 802.15.4 AES-CCM) pins `subtle = "=2.4"` exactly, which
# collides with rs-matter's `subtle ^2.6`. Vendored with the pin relaxed to ^2.4
# (subtle 2.4→2.6 is API-compatible for ccm's constant-time tag compare) so subtle
# unifies to 2.6.1. See docs/no-std-plan.md.
ccm             = { path = "vendor/ccm" }

[profile.dev]
opt-level = "z"   # esp-hal: debug is too slow; always optimize a little

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
debug         = 2
