[package]
name = "rcd-nostd"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["Yan Fitterer"]
description = "RCD Reset Controller — ESP32-H2, no-std (esp-hal) Matter over Thread"

[[bin]]
name = "rcd-nostd"
path = "src/main.rs"
harness = false

[features]
# Normal firmware: BLE commissioning + the full Matter stack. `matter-ble` also turns
# on `esp-radio/ble`, so the BLE controller is compiled into the radio subsystem.
default = ["matter-ble"]
matter-ble = ["esp-radio/ble"]

# Diagnostic: skip BLE/Matter entirely and attach Thread directly from a dataset
# supplied at build time via the THREAD_TEST_DATASET env var (hex TLV). Build it with
# `--no-default-features` so `esp-radio/ble` is NOT compiled in — this isolates the
# 802.15.4 radio to check whether the BLE feature itself breaks 802.15.4 RX:
#   THREAD_TEST_DATASET=0e08... ./build.sh run --release --no-default-features --features thread-only-test
thread-only-test = []

# ─── Core no-std esp-hal stack (version matrix from esp-rs/openthread esp example) ──
[dependencies]
esp-hal       = { version = "1.1", features = ["esp32h2", "log-04", "unstable", "exception-handler"] }
esp-rtos      = { version = "0.3", features = ["esp32h2", "esp-radio", "embassy"] }
# `ble` is added via the `matter-ble` cargo feature (on by default) so the thread-only
# diagnostic can build without it (`--no-default-features`) to isolate 802.15.4.
# `log-04` routes esp-radio's internal logging (info!/warn!/trace!) to the `log` crate
# (esp-println) — otherwise those macros are no-ops. Needed to see the 802.15.4 driver's
# own diagnostics (e.g. the vendored RX-interrupt debug).
esp-radio     = { version = "0.18", features = ["esp32h2", "unstable", "ieee802154", "log-04"] }
esp-alloc     = { version = "0.10" }
esp-backtrace = { version = "0.19", features = ["esp32h2", "panic-handler", "println"] }
esp-println   = { version = "0.17", features = ["esp32h2", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32h2", "log-04"] }

embassy-executor = { version = "0.10" }
embassy-time     = { version = "0.5" }
# 0.7 to match trouble-host 0.6's `#[gatt_server]` macro (it resolves the bare
# `embassy_sync` path against THIS crate's dep). openthread/rs-matter pull their
# own 0.8 transitively; we never cross the two versions' types directly.
embassy-sync     = { version = "0.7" }
embassy-futures  = { version = "0.1" }

log            = "0.4"
# `nb::block!` to drive esp-hal's non-blocking one-shot ADC reads in the EMF sensor.
nb             = "1.1"
critical-section = "1.2"
static_cell    = "2.1"
# Flash-backed persistence for Matter commissioning + Thread network (survive reboot).
# esp-storage = raw NOR flash (embedded-storage NorFlash); sequential-storage = a keyed
# blob map over a flash region (the `nvs` partition, located via esp-bootloader-esp-idf).
esp-storage    = { version = "0.7", features = ["esp32h2", "bytewise-read"] }
sequential-storage = "4"
embedded-storage = "0.3"
embedded-storage-async = "0.4"
heapless       = "0.8"
# trouble-host 0.6 uses heapless 0.9; its `AsGatt for Vec<u8,N>` is on that type,
# so the BTP C2 characteristic value must be a 0.9 Vec (aliased to avoid clashing
# with our 0.8 `heapless`).
heapless_09    = { package = "heapless", version = "0.9" }
rand_core      = "0.9"
# rs-matter's crypto wants a rand_core 0.6 `CryptoRngCore`; aliased so the matter
# glue can shim one over esp-hal's (0.9) Rng. See src/matter/stack.rs.
rand_core_06   = { package = "rand_core", version = "0.6", default-features = false }
# Force subtle ≥2.6 so it unifies across rs-matter (needs 2.6) and esp-radio's
# 802.15.4 ccm (vendored, pin relaxed). Direct dep makes it survive `cargo update`.
subtle         = { version = "2.6", default-features = false }

# Thread via OpenThread (prebuilt lib for riscv32imac-unknown-none-elf — no C build).
# H2 802.15.4 radio supported out of the box via the esp-radio feature.
openthread = { git = "https://github.com/esp-rs/openthread", features = [
    "esp-radio", "udp", "srp", "dns-client", "edge-nal", "isupper", "log",
] }
# C-lib shims OpenThread needs (utoa/strtoul) in no_std.
tinyrlibc  = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }

# BLE host (commissioning). Pinned to 0.6: it uses bt-hci 0.8.1, which esp-radio
# 0.18's BleConnector implements (trouble main needs bt-hci 0.9 → mismatch).
# 0.6 brings embassy-sync 0.7 — see the embassy-sync note above.
trouble-host = { version = "0.6", features = ["default-packet-pool-mtu-255", "derive"] }

# Matter: the generic rs-matter-stack (no_std, alloc + rustcrypto) on rs-matter.
# The transport glue (GattPeripheral over trouble, Thread over openthread) is ours.
#
# NOTE: the `log` feature is deliberately OMITTED. It forwards to `rs-matter/log`,
# which turns on rs-matter's internal logging — including `error!("...{:?}", status)`
# on the (benign) per-attribute wildcard-read path (rs-matter dm/types/reply.rs). That
# Debug-formats a deeply-nested AttrStatus/AttrPath, and the recursion, stacked on the
# already-deep commissioning + crypto call chain, OVERFLOWS the main task stack (all
# leftover RWDATA) and crashes with an illegal-instruction at a garbage PC mid-format.
# Since the TEST pairing credentials are fixed and known, we print them ourselves at
# startup (see matter::stack) instead of relying on rs-matter's QR/PairingCode logging.
# Re-enable only if you also enlarge the stack headroom (shrink the heap/bump statics).
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next", default-features = false, features = ["rustcrypto", "alloc"] }

# rs-matter-stack consumes rs-matter from crates.io; redirect both to the
# coordinated `sysgrok` forks (next). Patches only take effect from the root crate.
[patch.crates-io]
rs-matter       = { git = "https://github.com/sysgrok/rs-matter",       branch = "next" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next" }
# ccm 0.4.4 (esp-radio's 802.15.4 AES-CCM) pins `subtle = "=2.4"` exactly, which
# collides with rs-matter's `subtle ^2.6`. Vendored with the pin relaxed to ^2.4
# (subtle 2.4→2.6 is API-compatible for ccm's constant-time tag compare) so subtle
# unifies to 2.6.1. See docs/no-std-plan.md.
ccm             = { path = "vendor/ccm" }
# esp-radio 0.18.0 vendored to patch its ESP32-H2 802.15.4 RX path: the radio
# transmits fine but never delivers a received frame on H2 (OpenThread stays
# Detached — every MLE attach gets no parent response). See vendor/esp-radio and
# src/ieee802154/raw.rs. Drop this once esp-radio ships an H2 802.15.4 RX fix.
esp-radio       = { path = "vendor/esp-radio" }

[profile.dev]
opt-level = "z"   # esp-hal: debug is too slow; always optimize a little

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
debug         = 2

[profile.release.package.esp-radio]
opt-level = 3