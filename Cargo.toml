[package]
name = "rcd-nostd"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["Yan Fitterer"]
description = "RCD Reset Controller - ESP32-H2, no-std (esp-hal) Matter over Thread"

[[bin]]
name = "rcd-nostd"
path = "src/main.rs"
harness = false

# --- Matter-over-Thread via rs-matter-embassy (ivmarkov's blessed esp stack) ---------
# We build on `rs-matter-embassy` (EmbassyThreadMatterStack + EspThreadDriver), which
# bundles openthread + esp-radio + trouble + edge-nal-openthread + KV-backed persistence.
# All esp crates are pinned (via [patch] below) to esp-hal rev 10e48dd - the last commit
# where esp-radio is still 0.18 AND has the #5650 FCF-offset fix - matching the
# rs-matter-embassy esp example. openthread/openthread-sys/mbedtls-rs-sys track esp-rs
# `main`. See docs/upstream-prs/ and the plan.
[dependencies]
esp-hal       = { version = "~1.1", features = ["esp32h2", "log-04", "unstable", "exception-handler"] }
esp-rtos      = { version = "0.3", features = ["esp32h2", "esp-radio", "embassy"] }
esp-radio     = { version = "0.18", features = ["esp32h2", "ble", "log-04", "unstable"] }
esp-alloc     = { version = "0.10" }
esp-backtrace = { version = "0.19", features = ["esp32h2", "panic-handler", "println"] }
esp-println   = { version = "0.17", features = ["esp32h2", "log-04"] }
esp-storage   = { version = "0.9", features = ["esp32h2"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32h2", "log-04"] }
esp-metadata-generated = { version = "0.4", features = ["esp32h2"] }

embassy-executor = { version = "0.10" }
embassy-time     = { version = "0.5" }
embassy-sync     = { version = "0.8" }
embassy-futures  = { version = "0.1" }
# `BlockingAsync` adapter: wraps esp-storage's blocking FlashStorage as the async
# NorFlash that rs-matter-embassy's SeqMapKvBlobStore requires.
embassy-embedded-hal = { version = "0.6" }

# The Matter-over-Thread integration. `esp` = EspThreadDriver + SeqMapKvBlobStore sugar;
# `openthread` + `openthread-heap-int-8192` = Thread transport; `mbedtls` = external
# mbedtls-rs-sys (shared with openthread); `log` routes its logging to `log`/esp-println.
rs-matter-embassy = { git = "https://github.com/ivmarkov/rs-matter-embassy", default-features = false, features = ["esp", "openthread", "openthread-heap-int-8192", "mbedtls", "log", "rustcrypto"] }

log            = "0.4"
# esp-hal's Rng (rand_core 0.9) shimmed to rand_core 0.6 `CryptoRngCore` for rs-matter's
# `default_crypto` (see EspRng in src/matter/stack.rs). Uses the digital RNG (no ADC1), so
# ADC1 stays free for the EMF sensor - unlike the example's TrngSource(RNG, ADC1).
rand_core      = "0.9"
rand_core_06   = { package = "rand_core", version = "0.6", default-features = false }
# `nb::block!` to drive esp-hal's non-blocking one-shot ADC reads in the EMF sensor.
nb             = "1.1"
critical-section = "1.2"
static_cell    = "2.1"
heapless       = "0.8"
# Force subtle >=2.6 so it unifies across rs-matter (needs 2.6) and esp-radio's 802.15.4
# ccm (patched fork, pin relaxed - see [patch.crates-io]). Direct dep survives cargo update.
subtle         = { version = "2.6", default-features = false }
# C-lib shims OpenThread needs (memchr/utoa/strtoul) in no_std.
tinyrlibc      = { version = "0.5", default-features = false, features = ["memchr", "utoa", "strtoul"] }

[patch.crates-io]
# ivmarkov's coordinated "newest" esp stack (mirrors rs-matter-embassy/examples/esp).
# openthread/openthread-sys/mbedtls-rs-sys track esp-rs `main`; the esp-hal family is
# pinned to rev 10e48dd (esp-radio 0.18 + #5650). rs-matter / rs-matter-stack /
# edge-nal-openthread / trouble resolve from crates.io via rs-matter-embassy.
mbedtls-rs-sys         = { git = "https://github.com/esp-rs/mbedtls-rs" }
openthread             = { git = "https://github.com/esp-rs/openthread" }
openthread-sys         = { git = "https://github.com/esp-rs/openthread" }
esp-hal                = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-rtos               = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-alloc              = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-backtrace          = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-println            = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-radio              = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-storage            = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal", rev = "10e48dd74837bae4be663a7d1825d12875363727" }
# ccm 0.4.4 (pulled by ieee802154 0.6.1 -> esp-radio's 802.15.4 AES-CCM) pins
# subtle = "=2.4", which collides with rs-matter's subtle ^2.6. This one-line fork branch
# relaxes it to subtle = "2"; subtle then unifies to 2.6.1. See docs/no-std-plan.md.
ccm                    = { git = "https://github.com/yvf/AEADs", rev = "790a0a5d397afc907d80c513013d1b13f90ccab9" } # branch: ccm-0.4.4-relax-subtle

[profile.dev]
opt-level = "z"   # esp-hal: debug is too slow; always optimize a little

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
debug         = 2

[profile.release.package.esp-radio]
opt-level = 3
