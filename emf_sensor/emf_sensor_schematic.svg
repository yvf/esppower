<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="700" fill="white"/>
  <style>
    .wire   { stroke:#111; stroke-width:2; fill:none; }
    .comp   { stroke:#111; stroke-width:2; fill:none; }
    .lbl    { font-size:14px; fill:#111; }
    .ref    { font-size:14px; fill:#b00; font-weight:bold; }
    .pin    { font-size:12px; fill:#06c; }
    .note   { font-size:13px; fill:#111; }
    .title  { font-size:20px; fill:#111; font-weight:bold; }
    .dot    { fill:#111; }
  </style>

  <text x="40" y="34" class="title">EMF Mains-Presence Sensor — ½ LM358 amplifier (sensor end)</text>

  <!-- ===== Power rails ===== -->
  <line class="wire" x1="90" y1="70"  x2="940" y2="70"/>
  <line class="wire" x1="90" y1="620" x2="940" y2="620"/>
  <text x="40" y="66" class="lbl">+3V3</text>
  <text x="40" y="626" class="lbl">GND</text>

  <!-- ===== C4 VCC decoupling (recommended) ===== -->
  <line class="wire" x1="110" y1="70"  x2="110" y2="300"/>
  <line class="comp" x1="96"  y1="300" x2="124" y2="300"/>
  <line class="comp" x1="96"  y1="312" x2="124" y2="312"/>
  <line class="wire" x1="110" y1="312" x2="110" y2="620"/>
  <circle class="dot" cx="110" cy="70"  r="3.5"/>
  <circle class="dot" cx="110" cy="620" r="3.5"/>
  <text x="40" y="300" class="ref">C4</text>
  <text x="40" y="316" class="lbl">100nF</text>

  <!-- ===== Antenna + C1 input DC block ===== -->
  <circle class="comp" cx="160" cy="290" r="6"/>
  <text x="138" y="278" class="ref">ANT</text>
  <line class="wire" x1="166" y1="290" x2="214" y2="290"/>
  <line class="comp" x1="220" y1="278" x2="220" y2="302"/>
  <line class="comp" x1="232" y1="278" x2="232" y2="302"/>
  <line class="wire" x1="214" y1="290" x2="220" y2="290"/>
  <line class="wire" x1="232" y1="290" x2="330" y2="290"/>
  <text x="196" y="266" class="ref">C1</text>
  <text x="196" y="324" class="lbl">100nF</text>

  <!-- N_in node = inverting input (pin 2) -->
  <line class="wire" x1="330" y1="290" x2="590" y2="290"/>
  <circle class="dot" cx="330" cy="290" r="3.5"/>

  <!-- ===== Op-amp U1A ===== -->
  <path class="comp" d="M590,250 L590,390 L710,320 Z" fill="#fafafa"/>
  <text x="600" y="345" class="ref">U1A</text>
  <text x="588" y="408" class="lbl">½ LM358</text>
  <text x="566" y="286" class="pin">2 −</text>
  <text x="566" y="356" class="pin">3 +</text>
  <text x="722" y="312" class="pin">1</text>
  <text x="648" y="90"  class="pin">8</text>
  <text x="648" y="610" class="pin">4</text>
  <!-- inputs / output stubs -->
  <line class="wire" x1="550" y1="350" x2="590" y2="350"/>
  <line class="wire" x1="710" y1="320" x2="790" y2="320"/>
  <!-- VCC pin 8 -->
  <line class="wire" x1="640" y1="279" x2="640" y2="70"/>
  <circle class="dot" cx="640" cy="70" r="3.5"/>
  <!-- GND pin 4 -->
  <line class="wire" x1="640" y1="361" x2="640" y2="620"/>
  <circle class="dot" cx="640" cy="620" r="3.5"/>

  <!-- ===== Feedback: R4 (1M) || C3 (2.2nF) between OUT and IN- ===== -->
  <line class="wire" x1="330" y1="290" x2="330" y2="160"/>
  <line class="wire" x1="330" y1="160" x2="390" y2="160"/>
  <circle class="dot" cx="390" cy="160" r="3.5"/>
  <line class="wire" x1="390" y1="140" x2="390" y2="180"/>
  <!-- C3 branch (top) -->
  <line class="wire" x1="390" y1="140" x2="514" y2="140"/>
  <line class="comp" x1="514" y1="128" x2="514" y2="152"/>
  <line class="comp" x1="526" y1="128" x2="526" y2="152"/>
  <line class="wire" x1="526" y1="140" x2="650" y2="140"/>
  <text x="496" y="120" class="ref">C3</text>
  <text x="540" y="136" class="lbl">2.2nF</text>
  <!-- R4 branch (bottom) -->
  <line class="wire" x1="390" y1="180" x2="498" y2="180"/>
  <rect class="comp" x="498" y="171" width="44" height="18" fill="#fafafa"/>
  <line class="wire" x1="542" y1="180" x2="650" y2="180"/>
  <text x="503" y="167" class="ref">R4</text>
  <text x="548" y="194" class="lbl">1M</text>
  <!-- right bracket to OUT -->
  <line class="wire" x1="650" y1="140" x2="650" y2="180"/>
  <circle class="dot" cx="650" cy="160" r="3.5"/>
  <line class="wire" x1="650" y1="160" x2="790" y2="160"/>
  <line class="wire" x1="790" y1="160" x2="790" y2="320"/>
  <circle class="dot" cx="790" cy="320" r="3.5"/>

  <!-- ===== R3 (100k) between IN- and virtual ground ===== -->
  <line class="wire" x1="330" y1="290" x2="330" y2="353"/>
  <rect class="comp" x="321" y="353" width="18" height="44" fill="#fafafa"/>
  <line class="wire" x1="330" y1="397" x2="330" y2="450"/>
  <text x="345" y="372" class="ref">R3</text>
  <text x="345" y="388" class="lbl">100k</text>

  <!-- ===== Virtual-ground bus (y=450) ===== -->
  <line class="wire" x1="200" y1="450" x2="470" y2="450"/>
  <circle class="dot" cx="330" cy="450" r="3.5"/>
  <circle class="dot" cx="200" cy="450" r="3.5"/>
  <circle class="dot" cx="290" cy="450" r="3.5"/>
  <circle class="dot" cx="470" cy="450" r="3.5"/>

  <!-- pin 3 (+) to virtual ground -->
  <line class="wire" x1="470" y1="350" x2="550" y2="350"/>
  <line class="wire" x1="470" y1="350" x2="470" y2="450"/>

  <!-- ===== Divider R1 / R2 (10k each) ===== -->
  <line class="wire" x1="200" y1="70" x2="200" y2="138"/>
  <rect class="comp" x="191" y="138" width="18" height="44" fill="#fafafa"/>
  <line class="wire" x1="200" y1="182" x2="200" y2="450"/>
  <circle class="dot" cx="200" cy="70" r="3.5"/>
  <text x="215" y="157" class="ref">R1</text>
  <text x="215" y="173" class="lbl">10k</text>

  <line class="wire" x1="200" y1="450" x2="200" y2="518"/>
  <rect class="comp" x="191" y="518" width="18" height="44" fill="#fafafa"/>
  <line class="wire" x1="200" y1="562" x2="200" y2="620"/>
  <circle class="dot" cx="200" cy="620" r="3.5"/>
  <text x="215" y="537" class="ref">R2</text>
  <text x="215" y="553" class="lbl">10k</text>

  <!-- ===== C2 (100nF) virtual-ground bypass ===== -->
  <line class="wire" x1="290" y1="450" x2="290" y2="524"/>
  <line class="comp" x1="278" y1="524" x2="302" y2="524"/>
  <line class="comp" x1="278" y1="536" x2="302" y2="536"/>
  <line class="wire" x1="290" y1="536" x2="290" y2="620"/>
  <circle class="dot" cx="290" cy="620" r="3.5"/>
  <text x="305" y="528" class="ref">C2</text>
  <text x="305" y="544" class="lbl">100nF</text>

  <!-- ===== R5 (100R) output series + cable ===== -->
  <line class="wire" x1="790" y1="320" x2="828" y2="320"/>
  <rect class="comp" x="828" y="311" width="44" height="18" fill="#fafafa"/>
  <line class="wire" x1="872" y1="320" x2="940" y2="320"/>
  <text x="833" y="305" class="ref">R5</text>
  <text x="878" y="305" class="lbl">100R</text>

  <!-- ===== J1 output connector to shielded cable ===== -->
  <rect class="comp" x="950" y="120" width="80" height="270" fill="#fafafa"/>
  <text x="978" y="112" class="ref">J1</text>
  <text x="962" y="165" class="lbl">3V3</text>
  <text x="962" y="235" class="lbl">GND</text>
  <text x="962" y="325" class="lbl">SIG</text>
  <text x="962" y="370" class="lbl">SHLD</text>
  <text x="962" y="385" class="pin">(no trace)</text>
  <!-- 3V3 pin -> rail -->
  <line class="wire" x1="950" y1="160" x2="925" y2="160"/>
  <line class="wire" x1="925" y1="160" x2="925" y2="70"/>
  <circle class="dot" cx="925" cy="70" r="3.5"/>
  <!-- GND pin -> rail (crosses SIG with no dot = not connected) -->
  <line class="wire" x1="950" y1="230" x2="905" y2="230"/>
  <line class="wire" x1="905" y1="230" x2="905" y2="620"/>
  <circle class="dot" cx="905" cy="620" r="3.5"/>
  <!-- SIG pin -->
  <line class="wire" x1="940" y1="320" x2="950" y2="320"/>

  <!-- ===== Notes ===== -->
  <text x="40" y="655" class="note">● = connected junction.  Lines that cross WITHOUT a dot are not connected.</text>
  <text x="40" y="674" class="note">U1B (unused ½ of LM358): tie pin 5 (+IN) → GND and short pin 6 (−IN) ↔ pin 7 (OUT).   Shield: ground at the ESP end only — leave J1-SHLD open here.</text>
</svg>
